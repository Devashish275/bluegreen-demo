apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-app-__COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      version: __COLOR__
  template:
    metadata:
      labels:
        app: bg-app
        version: __COLOR__
    spec:
      containers:
      - name: bg-app
        image: __IMAGE__
        ports:
        - containerPort: 5000
        env:
        - name: APP_COLOR
          value: "__COLOR__"
